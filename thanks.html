<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gracias</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0d1117;
        color: #f5f7fa;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .card {
        max-width: 520px;
        width: 100%;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(18px);
        padding: 3rem 2.5rem;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
      }

      .emoji {
        font-size: 4rem;
        line-height: 1;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: clamp(2.25rem, 4vw, 3.25rem);
        letter-spacing: -0.05em;
        margin-bottom: 1rem;
      }

      p {
        color: #cdd3e0;
        line-height: 1.8;
        margin-bottom: 2rem;
        font-size: 1rem;
      }

      .note {
        font-size: 0.95rem;
        color: #8b95a3;
      }
      .button {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: #2384e8;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.3s ease;
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="emoji">✨</div>
      <h1>Pack Acheté!</h1>
      <p>
        Profite de tout les avantages obtenus grâce à ton achat en envoyant <b>!activatepack</b> au bot. Si tu as des questions ou besoin d'aide, n'hésite pas à nous contacter. Nous sommes là pour t'aider !
      </p>
      <a class="button" href="https://wa.me/237650687834?text=!activatepack">Envoyer !activatepack au bot</a>
      <div class="note">Werewolve by Vouks</div>
    </main>
  </body>
</html>
