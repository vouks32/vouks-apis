<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gracias</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0d1117;
        color: #f5f7fa;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .card {
        max-width: 520px;
        width: 100%;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(18px);
        padding: 3rem 2.5rem;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
      }

      .emoji {
        font-size: 4rem;
        line-height: 1;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: clamp(2.25rem, 4vw, 3.25rem);
        letter-spacing: -0.05em;
        margin-bottom: 1rem;
      }

      p {
        color: #cdd3e0;
        line-height: 1.8;
        margin-bottom: 2rem;
        font-size: 1rem;
      }

      .note {
        font-size: 0.95rem;
        color: #8b95a3;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="emoji">✨</div>
      <h1>Gracias por tu mensaje</h1>
      <p>
        Tu solicitud ha sido recibida correctamente. Nos pondremos en contacto contigo lo
        antes posible.
      </p>
      <div class="note">Que tengas un gran día.</div>
    </main>
  </body>
</html>
